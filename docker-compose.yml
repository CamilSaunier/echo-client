version: "3.8"

services:
  # Service Frontend (Vite / React)
  echo-client:
    build:
      # Contexte d'exécution du build (le dossier courant) et fichier Dockerfile utilisé
      context: .
      dockerfile: Dockerfile
    container_name: echo-client
    # Au démarrage : install initial, puis lancement de Vite en arrière-plan (&),
    # puis une boucle inotifywait qui surveille package.json et pnpm-lock.yaml.
    # Dès que l'un des deux fichiers est modifié depuis l'hôte (ex: tu ajoutes une dépendance
    # à la main, ou via un `pnpm add` lancé en local), le conteneur relance automatiquement
    # `pnpm install` sans que tu aies besoin de faire un `exec` ou un restart manuel.
    # Vite (déjà lancé) détecte ensuite les nouveaux modules via son HMR habituel.
    command: >
      sh -c "
      pnpm install &&
      pnpm dev -- --host &
      while inotifywait -e close_write package.json pnpm-lock.yaml; do
        echo '📦 Changement détecté sur package.json/pnpm-lock.yaml, réinstallation...' &&
        pnpm install;
      done
      "
    ports:
      # Expose le port de dev Vite (5173) de la machine hôte vers le conteneur
      - "5173:5173"
    volumes:
      # Mount du code source local dans /app pour activer le Hot Module Replacement (HMR)
      - .:/app
      # Utilisation d'un volume nommé dédié pour isoler et persister les node_modules du conteneur
      - client_node_modules:/app/node_modules
    env_file:
      # Charge automatiquement le fichier .env situé à la racine du projet front
      - .env
    environment:
      # Variable d'environnement lue par Vite au build/serve pour pointer vers l'API backend
      - VITE_API_URL=${VITE_API_URL}
      - CI=true
    restart: unless-stopped

volumes:
  # Déclaration du volume nommé pour stocker les dépendances du client en dehors du code source
  client_node_modules:
